# =============================================================================
# IBVAP Backend - Docker Compose for Production & Development
# =============================================================================
# Usage:
#   Development:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   Production:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------
  # PostgreSQL Database (Optional - for production use)
  # ---------------------------------------------------------
  # Comment out this service and use SQLite (default) if not needed
  postgres:
    image: postgres:16-alpine
    container_name: ibvap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ibvap}
      POSTGRES_USER: ${POSTGRES_USER:-ibvap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # REQUIRED - no default!
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibvap} -d ${POSTGRES_DB:-ibvap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibvap-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles:
      - database  # Enable with: docker compose --profile database up

  # ---------------------------------------------------------
  # Redis Cache & Pub/Sub (Optional - for production use)
  # ---------------------------------------------------------
  # Comment out this service if not needed
  redis:
    image: redis:7-alpine
    container_name: ibvap-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ibvap-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    profiles:
      - cache  # Enable with: docker compose --profile cache up

  # ---------------------------------------------------------
  # IBVAP FastAPI Backend
  # ---------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ibvap-backend
    restart: unless-stopped
    runtime: nvidia
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      # Database - uses SQLite by default, PostgreSQL when profile enabled
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./ibvap.db}
      # Redis - only used when cache profile enabled
      - REDIS_URL=${REDIS_URL:-}
      # REQUIRED in production - no defaults!
      - API_KEY=${API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_MINUTES=60
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - MODEL_PATH=/app/models
      - UPLOAD_DIR=/app/uploads
      # Configurable detection classes
      - PERSON_CLASS_ID=0
      - VEHICLE_CLASS_IDS=2,3,5,7
      - ALLOWED_CLASS_IDS=0,2,3,5,7
      # WebSocket settings
      - WS_VIDEO_SOURCE=${WS_VIDEO_SOURCE:-test_video.mp4}
      - WS_FRAME_INTERVAL=0.033
      - WS_MAX_QUEUE_SIZE=10
      # Rate limiting
      - AUTH_RATE_LIMIT=10
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./temp:/app/temp
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - ibvap-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

  # ---------------------------------------------------------
  # Nginx Reverse Proxy with TLS Termination (Optional)
  # ---------------------------------------------------------
  # Only enable when SSL certificates are available
  nginx:
    image: nginx:alpine
    container_name: ibvap-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ibvap-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    profiles:
      - proxy  # Enable with: docker compose --profile proxy up

  # ---------------------------------------------------------
  # Prometheus Monitoring (Optional)
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: ibvap-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ibvap-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ---------------------------------------------------------
  # Grafana Dashboard (Optional)
  # ---------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: ibvap-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}  # REQUIRED - no default!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ibvap-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  ibvap-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_cache:
    driver: local